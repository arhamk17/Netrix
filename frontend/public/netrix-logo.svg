<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="globe-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0B1C33" stopOpacity="0.95" />
      <stop offset="65%" stopColor="#050A14" stopOpacity="0.98" />
      <stop offset="100%" stopColor="#020408" stopOpacity="1" />
    </radialGradient>
    <linearGradient id="titanium-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5A6D88" />
      <stop offset="30%" stopColor="#253549" />
      <stop offset="70%" stopColor="#111B29" />
      <stop offset="100%" stopColor="#0A101A" />
    </linearGradient>
    <linearGradient id="titanium-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6C82A3" />
      <stop offset="45%" stopColor="#2F4259" />
      <stop offset="85%" stopColor="#132030" />
      <stop offset="100%" stopColor="#0B131E" />
    </linearGradient>
    <linearGradient id="cyan-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#80F5FF" />
      <stop offset="35%" stopColor="#00F0FF" />
      <stop offset="70%" stopColor="#0090FF" />
      <stop offset="100%" stopColor="#0044FF" />
    </linearGradient>
    <linearGradient id="text-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#D9E6F2" />
      <stop offset="25%" stopColor="#9AB2CC" />
      <stop offset="50%" stopColor="#4A6178" />
      <stop offset="75%" stopColor="#203144" />
      <stop offset="100%" stopColor="#101C2B" />
    </linearGradient>
  </defs>

  <!-- Globe Background -->
  <circle cx="400" cy="310" r="230" fill="url(#globe-grad)" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="400" cy="310" r="248" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.18" stroke-dasharray="6 4" />

  <!-- Coordinates & Mesh -->
  <g stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.22" fill="none">
    <ellipse cx="400" cy="310" rx="226" ry="85" />
    <ellipse cx="400" cy="310" rx="226" ry="165" />
    <ellipse cx="400" cy="310" rx="85" ry="226" />
    <ellipse cx="400" cy="310" rx="165" ry="226" />
    <line x1="170" y1="310" x2="630" y2="310" stroke-opacity="0.4" />
    <line x1="400" y1="80" x2="400" y2="540" stroke-opacity="0.4" />
  </g>

  <!-- Crosshair Ticks -->
  <g stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5">
    <line x1="400" y1="56" x2="400" y2="76" />
    <line x1="400" y1="544" x2="400" y2="564" />
    <line x1="146" y1="310" x2="166" y2="310" />
    <line x1="634" y1="310" x2="654" y2="310" />
  </g>

  <!-- Side Metadata Labels -->
  <g font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" letter-spacing="3.5" fill="#8FA4BD" text-anchor="end">
    <text x="145" y="280">EVIDENCE</text>
    <text x="145" y="310">INTELLIGENCE</text>
    <text x="145" y="340">JUSTICE</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" letter-spacing="3.5" fill="#8FA4BD" text-anchor="start">
    <text x="655" y="280">ANALYZE</text>
    <text x="655" y="310">CONNECT</text>
    <text x="655" y="340">PREVENT</text>
  </g>

  <!-- Master Emblem 'N' -->
  <g>
    <!-- Left Pillar with Fingerprint Texture -->
    <path d="M 265 140 L 335 140 L 335 340 L 515 485 L 535 485 L 535 520 L 495 520 L 265 330 Z" fill="url(#titanium-left)" stroke="#1B314B" stroke-width="2" />
    
    <!-- Laser Cyan Spine -->
    <path d="M 265 140 L 275 140 L 535 495 L 525 495 Z" fill="url(#cyan-laser)" filter="url(#cyan-glow)" />
    <line x1="265" y1="140" x2="535" y2="495" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Right Pillar -->
    <path d="M 465 130 L 535 130 L 535 470 L 465 410 Z" fill="url(#titanium-right)" stroke="#2A4566" stroke-width="2" />
    <line x1="465" y1="130" x2="465" y2="410" stroke="#8EC5FC" stroke-width="2" stroke-opacity="0.8" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(0, 520)">
    <text x="400" y="110" font-family="Chakra Petch, 'JetBrains Mono', sans-serif" font-size="116" font-weight="900" letter-spacing="24" fill="url(#text-metal)" stroke="#6BA8E6" stroke-width="1.8" text-anchor="middle">
      NETRIX
    </text>
    <g transform="translate(0, 150)">
      <line x1="140" y1="-5" x2="220" y2="-5" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5" />
      <text x="400" y="0" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700" letter-spacing="10" fill="#C0D8F0" text-anchor="middle">
        INTELLIGENCE BEYOND EVIDENCE
      </text>
      <line x1="580" y1="-5" x2="660" y2="-5" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5" />
    </g>
    <g transform="translate(0, 195)" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" letter-spacing="3.5" fill="#758FA8" text-anchor="middle">
      <text x="400" y="0">
        CRIMINAL NETWORK ANALYSIS  |  INVESTIGATIVE INTELLIGENCE  |  EVIDENCE INTEGRITY
      </text>
    </g>
  </g>
</svg>
